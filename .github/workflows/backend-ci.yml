name: Backend CI
on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
permissions:
    contents: read
jobs:
  backend-build:
    name: Backend build and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./stockflow-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode clean verify